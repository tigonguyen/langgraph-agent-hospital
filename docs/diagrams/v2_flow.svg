<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Helvetica, Arial, sans-serif">
  <title>V2 — three-agent flow</title>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">V2 — Multi-agent (distiller → clinical reasoner → decider)</text>

  <rect x="40" y="44" width="60" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="70" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">START</text>
  <rect x="132" y="44" width="118" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="191" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">reason</text>
  <text x="191" y="78" text-anchor="middle" font-size="11" fill="#6D28D9">LLM call 1</text>
  <rect x="282" y="44" width="118" height="42" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="341" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#115E59">retrieve</text>
  <text x="341" y="78" text-anchor="middle" font-size="11" fill="#0F766E">no LLM · ~40 ms</text>
  <rect x="432" y="44" width="148" height="42" rx="8" fill="#FFE4E6" stroke="#E11D48"/>
  <text x="506" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#9F1239">clinical_reason</text>
  <text x="506" y="78" text-anchor="middle" font-size="11" fill="#BE123C">LLM call 2 · ~25 s</text>

  <line x1="100" y1="65" x2="126" y2="65" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="250" y1="65" x2="276" y2="65" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="400" y1="65" x2="426" y2="65" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="263" y="36" text-anchor="middle" font-size="11" fill="#475569">query</text>
  <text x="413" y="36" text-anchor="middle" font-size="11" fill="#475569">evidence</text>

  <path d="M506 86 L506 106 L240 106 L240 126" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="373" y="101" text-anchor="middle" font-size="11" fill="#475569">rationale</text>

  <rect x="150" y="126" width="180" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="240" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">answer · decider</text>
  <text x="240" y="160" text-anchor="middle" font-size="11" fill="#6D28D9">LLM call 3</text>
  <rect x="362" y="126" width="150" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="437" y="144" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">parse_choice</text>
  <text x="437" y="160" text-anchor="middle" font-size="11" fill="#6D28D9">letter → 0-3 or None</text>
  <rect x="544" y="126" width="60" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="574" y="152" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">END</text>
  <line x1="330" y1="147" x2="356" y2="147" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="512" y1="147" x2="538" y2="147" stroke="#64748B" stroke-width="1.5" marker-end="url(#a2)"/>

  <line x1="40" y1="198" x2="640" y2="198" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="340" y="222" text-anchor="middle" font-size="11" fill="#475569">the three agents</text>

  <rect x="40" y="240" width="186" height="112" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="133" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">1 · query distiller</text>
  <text x="133" y="288" text-anchor="middle" font-size="11" fill="#6D28D9">vignette → ≤20-word</text>
  <text x="133" y="306" text-anchor="middle" font-size="11" fill="#6D28D9">search query</text>
  <text x="133" y="330" text-anchor="middle" font-size="11" fill="#6D28D9">a RAG helper</text>

  <rect x="247" y="240" width="186" height="112" rx="8" fill="#FFE4E6" stroke="#E11D48"/>
  <text x="340" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#9F1239">2 · clinical reasoner</text>
  <text x="340" y="288" text-anchor="middle" font-size="11" fill="#BE123C">findings · what is asked</text>
  <text x="340" y="306" text-anchor="middle" font-size="11" fill="#BE123C">each option for/against</text>
  <text x="340" y="330" text-anchor="middle" font-size="11" fill="#BE123C">never names an option</text>

  <rect x="454" y="240" width="186" height="112" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="547" y="266" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">3 · decider</text>
  <text x="547" y="288" text-anchor="middle" font-size="11" fill="#6D28D9">weighs the analysis</text>
  <text x="547" y="306" text-anchor="middle" font-size="11" fill="#6D28D9">commits to one letter</text>
  <text x="547" y="330" text-anchor="middle" font-size="11" fill="#6D28D9">no re-derivation</text>

  <text x="340" y="390" text-anchor="middle" font-size="11" fill="#64748B">V2 − V1 = the clinical_reason node, plus answer role rag-answerer → decider</text>
  <text x="340" y="412" text-anchor="middle" font-size="11" fill="#64748B">3 LLM calls/item · ~28.9 s · pink = the new stage</text>
  <text x="340" y="442" text-anchor="middle" font-size="11" fill="#64748B">retrieval, gate and no-RAG fallback are inherited from V1 unchanged</text>
</svg>
