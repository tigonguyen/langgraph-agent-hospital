<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="Helvetica, Arial, sans-serif">
  <title>V1 - single agentic-RAG agent</title>
  <defs>
    <marker id="v1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">V1 - a single agent, decides for itself when and what to search</text>
  <text x="400" y="40" text-anchor="middle" font-size="11" fill="#64748B">1 agent - the graph is a single node: START -&gt; agent -&gt; END</text>

  <rect x="40" y="56" width="80" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="80" y="82" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">START</text>

  <rect x="200" y="56" width="220" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="310" y="74" text-anchor="middle" font-size="12.5" font-weight="500" fill="#5B21B6">agent - Agent(rag-agent)</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#6D28D9">tools=[search_medmcqa], max 2 calls</text>

  <rect x="500" y="56" width="150" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="575" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">parse_choice</text>
  <text x="575" y="90" text-anchor="middle" font-size="10" fill="#6D28D9">letter -&gt; 0-3, or None</text>

  <rect x="710" y="56" width="60" height="42" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="740" y="82" text-anchor="middle" font-size="12" fill="#334155">END</text>

  <line x1="120" y1="77" x2="196" y2="77" stroke="#64748B" stroke-width="1.5" marker-end="url(#v1a)"/>
  <line x1="420" y1="77" x2="496" y2="77" stroke="#64748B" stroke-width="1.5" marker-end="url(#v1a)"/>
  <line x1="650" y1="77" x2="706" y2="77" stroke="#64748B" stroke-width="1.5" marker-end="url(#v1a)"/>

  <line x1="310" y1="98" x2="310" y2="118" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#475569">inside agent.say - create_agent's tool loop</text>

  <rect x="60" y="144" width="220" height="68" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="170" y="165" text-anchor="middle" font-size="11.5" font-weight="500" fill="#5B21B6">LLM turn 1</text>
  <text x="170" y="181" text-anchor="middle" font-size="9.5" fill="#6D28D9">reads the RAG_AGENT prompt + question,</text>
  <text x="170" y="194" text-anchor="middle" font-size="9.5" fill="#6D28D9">emits a search_medmcqa(query) call</text>

  <line x1="280" y1="178" x2="316" y2="178" stroke="#64748B" stroke-width="1.5" marker-end="url(#v1a)"/>

  <rect x="320" y="144" width="220" height="68" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="430" y="165" text-anchor="middle" font-size="11.5" font-weight="500" fill="#115E59">search_medmcqa (tool)</text>
  <text x="430" y="181" text-anchor="middle" font-size="9.5" fill="#0F766E">qwen3-embedding:4b (32K token)</text>
  <text x="430" y="194" text-anchor="middle" font-size="9.5" fill="#0F766E">Chroma cosine top-5, no gate</text>

  <line x1="540" y1="178" x2="576" y2="178" stroke="#64748B" stroke-width="1.5" marker-end="url(#v1a)"/>

  <rect x="580" y="144" width="200" height="68" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="680" y="163" text-anchor="middle" font-size="11.5" font-weight="500" fill="#5B21B6">LLM turn 2</text>
  <text x="680" y="178" text-anchor="middle" font-size="9.5" fill="#6D28D9">reads the evidence, self-rates</text>
  <text x="680" y="191" text-anchor="middle" font-size="9.5" fill="#6D28D9">HIGH/MEDIUM/LOW, applies the</text>
  <text x="680" y="204" text-anchor="middle" font-size="9.5" fill="#6D28D9">asymmetric-trust rule, writes "Answer: X"</text>

  <path d="M170 212 L170 230 L680 230 L680 212" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#v1a)"/>
  <text x="425" y="246" text-anchor="middle" font-size="9.5" fill="#475569">if LOW, retried at most once (different query) before being forced to answer</text>

  <text x="400" y="286" text-anchor="middle" font-size="11" fill="#64748B">Asymmetric-trust rule: HIGH evidence wins by default, overturned only when reasoning names a</text>
  <text x="400" y="304" text-anchor="middle" font-size="11" fill="#64748B">specific finding the evidence missed; MEDIUM/LOW is set aside entirely, decided purely from the model's own reasoning.</text>
  <text x="400" y="330" text-anchor="middle" font-size="10.5" fill="#64748B">purple = LLM call - teal = retrieval (no LLM, the model decides for itself whether to call it)</text>
</svg>
