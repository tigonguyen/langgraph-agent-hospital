<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="Helvetica, Arial, sans-serif">
  <title>Hạ tầng truy hồi — từ dữ liệu đến bằng chứng thô</title>
  <defs>
    <marker id="ri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">Hạ tầng truy hồi — từ dữ liệu đến bằng chứng thô</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#64748B">Xây offline một lần; dùng chung cho V1 và Node 2 của V2--V4</text>

  <rect x="70" y="58" width="500" height="46" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">MedMCQA — 182.822 câu thi đã giải</text>
  <text x="320" y="94" text-anchor="middle" font-size="9.5" fill="#475569">HF: openlifescienceai/medmcqa (chỉ câu hỏi được nhúng; đáp án/giải thích là metadata)</text>
  <line x1="320" y1="104" x2="320" y2="116" stroke="#64748B" stroke-width="1.4" marker-end="url(#ri)"/>

  <rect x="70" y="118" width="500" height="50" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="320" y="138" text-anchor="middle" font-size="12" font-weight="500" fill="#115E59">Embedding (qua Ollama)</text>
  <text x="320" y="154" text-anchor="middle" font-size="10" fill="#0F766E">qwen3-embedding:4b (V1, 32K token) · nomic-embed-text (V2--V4, 8192 token)</text>
  <line x1="320" y1="168" x2="320" y2="180" stroke="#64748B" stroke-width="1.4" marker-end="url(#ri)"/>

  <rect x="70" y="182" width="500" height="56" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="320" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#115E59">ChromaDB — cosine / HNSW, kho vector bền (persistent)</text>
  <text x="320" y="218" text-anchor="middle" font-size="9.5" fill="#0F766E">2 collection tách biệt (embedder khác nhau, không dùng chung được):</text>
  <text x="320" y="231" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#0F766E">knowledge_medmcqa_qwen3 (V1) · knowledge_medmcqa_nomic (V2--V4)</text>
  <line x1="320" y1="238" x2="320" y2="250" stroke="#64748B" stroke-width="1.4" marker-end="url(#ri)"/>

  <rect x="70" y="252" width="500" height="56" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">search_medmcqa — LangChain @tool</text>
  <text x="320" y="288" text-anchor="middle" font-size="9.5" fill="#6D28D9">invoke(query) → Chroma.similarity_search, top-5, threshold=0.0 (không cổng)</text>
  <text x="320" y="301" text-anchor="middle" font-size="9.5" fill="#6D28D9">agent tự gọi (V1, agentic) · đồ thị gọi trực tiếp (V2--V4, deterministic)</text>
  <line x1="320" y1="308" x2="320" y2="320" stroke="#64748B" stroke-width="1.4" marker-end="url(#ri)"/>

  <rect x="70" y="322" width="500" height="46" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="320" y="343" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">5 câu thi tương tự — bằng chứng thô</text>
  <text x="320" y="359" text-anchor="middle" font-size="9.5" fill="#475569">định dạng Q: / A: / Why: mỗi câu, kèm đáp án đúng và giải thích</text>

  <text x="320" y="404" text-anchor="middle" font-size="10.5" fill="#64748B">Truy hồi tự nó không dùng LLM — chi phí là embed 1 truy vấn (~ms) và tìm cosine top-5 (sub-ms).</text>
  <text x="320" y="422" text-anchor="middle" font-size="10.5" fill="#64748B">Bằng chứng thô này là đầu vào cho bước digest + tự chấm độ tin cậy (Hình kế tiếp, mục 3.2).</text>
</svg>
