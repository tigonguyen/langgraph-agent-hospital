<svg xmlns="http://www.w3.org/2000/svg" width="780" height="348" viewBox="0 0 780 348" font-family="Helvetica, Arial, sans-serif">
  <title>Short-term memory — QAState fields as channels between nodes</title>
  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">Short-term memory — QAState fields are the channels nodes use to talk to each other</text>
  <text x="390" y="42" text-anchor="middle" font-size="11" fill="#64748B">No separate memory agent/store: every node reads what an earlier node wrote, straight from shared state</text>

  <!-- table -->
  <rect x="30" y="64" width="220" height="34" fill="#E2E8F0"/>
  <rect x="250" y="64" width="180" height="34" fill="#E2E8F0"/>
  <rect x="430" y="64" width="320" height="34" fill="#E2E8F0"/>
  <text x="40" y="86" font-size="11.5" font-weight="500" fill="#334155">Field in QAState</text>
  <text x="260" y="86" font-size="11.5" font-weight="500" fill="#334155">Written by</text>
  <text x="440" y="86" font-size="11.5" font-weight="500" fill="#334155">Read by</text>

  <!-- row: query -->
  <rect x="30" y="98" width="220" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="250" y="98" width="180" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="430" y="98" width="320" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="121" font-size="11" font-family="monospace" fill="#334155">query</text>
  <text x="260" y="121" font-size="11" fill="#475569">Node 1 (understand)</text>
  <text x="440" y="121" font-size="11" fill="#475569">Node 2 (search)</text>

  <!-- row: evidence -->
  <rect x="30" y="134" width="220" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="250" y="134" width="180" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="430" y="134" width="320" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="157" font-size="11" font-family="monospace" fill="#334155">evidence</text>
  <text x="260" y="157" font-size="11" fill="#475569">Node 2 (search)</text>
  <text x="440" y="157" font-size="11" fill="#475569">Node 4 (decider), Node 5 (verifier)</text>

  <!-- row: clinical_report -->
  <rect x="30" y="170" width="220" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="250" y="170" width="180" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="430" y="170" width="320" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="193" font-size="11" font-family="monospace" fill="#334155">clinical_report</text>
  <text x="260" y="193" font-size="11" fill="#475569">Node 3 (reasoning)</text>
  <text x="440" y="193" font-size="11" fill="#475569">Node 4 (decider), Node 5 (verifier)</text>

  <!-- row: case_understanding -->
  <rect x="30" y="206" width="220" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="250" y="206" width="180" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="430" y="206" width="320" height="36" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="229" font-size="11" font-family="monospace" fill="#334155">case_understanding</text>
  <text x="260" y="229" font-size="11" fill="#475569">Node 1 (understand)</text>
  <text x="440" y="229" font-size="11" fill="#475569">Node 3 (reasoning), Node 5 (verifier)</text>

  <!-- row: answer/rationale -->
  <rect x="30" y="242" width="220" height="42" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="250" y="242" width="180" height="42" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="430" y="242" width="320" height="42" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="40" y="268" font-size="11" font-family="monospace" fill="#334155">answer, rationale</text>
  <text x="260" y="268" font-size="11" fill="#475569">Node 4 (decider)</text>
  <text x="440" y="262" font-size="11" fill="#475569">overwritten by Node 5, if present (V4/V5);</text>
  <text x="440" y="276" font-size="11" fill="#475569">Node 6 reads answer to check correctness (V5)</text>

  <rect x="30" y="64" width="720" height="220" fill="none" stroke="#94A3B8" stroke-width="1"/>

  <text x="390" y="302" text-anchor="middle" font-size="10.5" fill="#64748B">Each field is written once and read straight off state by every node downstream — no agent, no store, no extra LLM call.</text>
  <text x="390" y="320" text-anchor="middle" font-size="10.5" fill="#64748B">No cross-question (episodic) memory in this table — every row lives only within one thread (one question).</text>
</svg>
