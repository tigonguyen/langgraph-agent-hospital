<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="405" viewBox="0 0 1080 405" font-family="Helvetica, Arial, sans-serif">
  <title>V3 — 4-node design + report-verifier</title>
  <defs>
    <marker id="v3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="540" y="22" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">V3 — understand → (search ‖ reasoning) → answer → verify</text>
  <text x="540" y="40" text-anchor="middle" font-size="11" fill="#64748B">5 tác tử, 5 lượt gọi LLM/câu · V2 + Node 5, + bộ nhớ ngắn hạn (memory=True)</text>

  <rect x="30" y="119" width="70" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="65" y="144" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">START</text>

  <rect x="140" y="107" width="180" height="64" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="230" y="128" text-anchor="middle" font-size="12.5" font-weight="500" fill="#5B21B6">understand — Node 1</text>
  <text x="230" y="144" text-anchor="middle" font-size="10" fill="#6D28D9">Agent(case-reasoner) · LLM call 1</text>
  <text x="230" y="159" text-anchor="middle" font-size="10" fill="#6D28D9">→ case_understanding + query (dùng chung)</text>

  <line x1="100" y1="139" x2="134" y2="139" stroke="#64748B" stroke-width="1.5" marker-end="url(#v3a)"/>

  <text x="480" y="63" text-anchor="middle" font-size="10.5" font-weight="500" fill="#334155">search (Node 2, bundled thành một node)</text>
  <rect x="370" y="69" width="220" height="30" rx="7" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="480" y="85" text-anchor="middle" font-size="11" font-weight="500" fill="#115E59">retrieve — search_medmcqa</text>
  <text x="480" y="96" text-anchor="middle" font-size="9" fill="#0F766E">tool do đồ thị gọi · không LLM · ~40 ms</text>
  <line x1="480" y1="99" x2="480" y2="109" stroke="#94A3B8" stroke-width="1.3" marker-end="url(#v3a)"/>
  <rect x="370" y="111" width="220" height="40" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="480" y="128" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">evidence-digest — LLM call 2</text>
  <text x="480" y="142" text-anchor="middle" font-size="9" fill="#6D28D9">tóm bằng chứng, tự chấm HIGH/MEDIUM/LOW</text>

  <rect x="370" y="189" width="220" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="480" y="209" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">clinical-reasoner — Node 3 · LLM call 3</text>
  <text x="480" y="223" text-anchor="middle" font-size="9" fill="#6D28D9">option-by-option, tự chấm tin cậy</text>
  <text x="480" y="235" text-anchor="middle" font-size="9" fill="#6D28D9">KHÔNG thấy bằng chứng (chạy đồng thời Node 2)</text>

  <line x1="320" y1="125" x2="360" y2="90" stroke="#64748B" stroke-width="1.3" marker-end="url(#v3a)"/>
  <line x1="320" y1="153" x2="360" y2="213" stroke="#64748B" stroke-width="1.3" marker-end="url(#v3a)"/>
  <text x="325" y="171" font-size="9" fill="#94A3B8" font-style="italic">chạy đồng thời — cùng một superstep LangGraph</text>

  <rect x="640" y="125" width="150" height="72" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="715" y="147" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">decider — Node 4</text>
  <text x="715" y="162" text-anchor="middle" font-size="10" fill="#6D28D9">LLM call 4</text>
  <text x="715" y="176" text-anchor="middle" font-size="9" fill="#6D28D9">luật tin cậy bất đối xứng</text>
  <text x="715" y="189" text-anchor="middle" font-size="9" fill="#6D28D9">→ "Answer: X" (đề xuất)</text>

  <line x1="590" y1="111" x2="636" y2="149" stroke="#64748B" stroke-width="1.3" marker-end="url(#v3a)"/>
  <line x1="590" y1="215" x2="636" y2="173" stroke="#64748B" stroke-width="1.3" marker-end="url(#v3a)"/>

  <!-- Node 5: report-verifier — the new stage in V3, pink like the ladder's "new" highlight -->
  <rect x="850" y="97" width="190" height="128" rx="8" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="945" y="118" text-anchor="middle" font-size="12" font-weight="500" fill="#9F1239">report-verifier — Node 5</text>
  <text x="945" y="133" text-anchor="middle" font-size="10" fill="#BE123C">LLM call 5 · không có công cụ tra cứu</text>
  <text x="945" y="152" text-anchor="middle" font-size="9" fill="#BE123C">đọc thẳng từ QAState (không qua message):</text>
  <text x="945" y="166" text-anchor="middle" font-size="9" fill="#BE123C">clinical_report (Node 3)</text>
  <text x="945" y="179" text-anchor="middle" font-size="9" fill="#BE123C">+ case_understanding (Node 1, memory=True)</text>
  <text x="945" y="197" text-anchor="middle" font-size="9" fill="#BE123C">kiểm nhất quán với Node 4 → giữ hoặc chỉnh</text>
  <text x="945" y="212" text-anchor="middle" font-size="9" fill="#BE123C">→ "Answer: X" (cuối cùng)</text>

  <line x1="790" y1="161" x2="846" y2="151" stroke="#64748B" stroke-width="1.5" marker-end="url(#v3a)"/>

  <rect x="900" y="253" width="90" height="36" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="945" y="276" text-anchor="middle" font-size="12" fill="#334155">END</text>
  <line x1="945" y1="225" x2="945" y2="249" stroke="#64748B" stroke-width="1.5" marker-end="url(#v3a)"/>

  <text x="540" y="321" text-anchor="middle" font-size="11" fill="#64748B">Node 5 không có bộ nhớ/tác tử riêng để "nhớ lại" Node 1/3 — case_understanding và clinical_report đã nằm sẵn</text>
  <text x="540" y="339" text-anchor="middle" font-size="11" fill="#64748B">trong QAState dùng chung; memory=True chỉ mở thêm một điểm đọc, không thêm lượt gọi LLM nào.</text>
  <text x="540" y="367" text-anchor="middle" font-size="10.5" fill="#64748B">purple = lượt gọi LLM · teal = truy hồi (không LLM) · hồng = giai đoạn mới trong V3</text>
</svg>
