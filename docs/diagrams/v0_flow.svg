<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="Helvetica, Arial, sans-serif">
  <title>V0 — Direct LLM baseline</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">V0 — Direct LLM (control baseline)</text>

  <rect x="100" y="50" width="90" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="145" y="77" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">START</text>

  <rect x="240" y="50" width="200" height="44" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="340" y="69" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">answer</text>
  <text x="340" y="85" text-anchor="middle" font-size="11" fill="#6D28D9">the only node · 1 LLM call</text>

  <rect x="490" y="50" width="90" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="535" y="77" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">END</text>

  <line x1="190" y1="72" x2="234" y2="72" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="440" y1="72" x2="484" y2="72" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="212" y="42" text-anchor="middle" font-size="11" fill="#475569">item</text>
  <text x="462" y="42" text-anchor="middle" font-size="11" fill="#475569">answer + rationale</text>

  <line x1="340" y1="94" x2="340" y2="118" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="340" y="136" text-anchor="middle" font-size="11" fill="#475569">inside the answer node</text>

  <rect x="45" y="152" width="170" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="130" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">format_mcq</text>
  <text x="130" y="199" text-anchor="middle" font-size="11" fill="#6D28D9">question + A/B/C/D</text>

  <rect x="255" y="152" width="170" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="340" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">LLM call</text>
  <text x="340" y="199" text-anchor="middle" font-size="11" fill="#6D28D9">physician prompt</text>

  <rect x="465" y="152" width="170" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="550" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#5B21B6">parse_choice</text>
  <text x="550" y="199" text-anchor="middle" font-size="11" fill="#6D28D9">letter → index, or None</text>

  <line x1="215" y1="185" x2="249" y2="185" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="425" y1="185" x2="459" y2="185" stroke="#64748B" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#64748B">No retrieval · no memory · no other agents — the anchor for Accuracy(Vn) − Accuracy(V0)</text>
</svg>
