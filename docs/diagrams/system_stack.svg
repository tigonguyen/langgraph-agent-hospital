<svg xmlns="http://www.w3.org/2000/svg" width="900" height="958" viewBox="0 0 900 958" font-family="Helvetica, Arial, sans-serif">
  <title>Technologies stack - end to end</title>
  <defs>
    <marker id="ss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="500" fill="#0F172A">Foundation architecture - technologies stack</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#64748B">From raw data to graded answer - each block is a component in the source code</text>

  <!-- Layer A: data (RAG side only - long-term memory has no raw-data input, it is populated live) -->
  <text x="100" y="70" font-size="10.5" font-weight="500" fill="#94A3B8">DATA (HuggingFace datasets, same org: openlifescienceai)</text>
  <rect x="100" y="76" width="400" height="66" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="300" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">MedQA-USMLE</text>
  <text x="300" y="117" text-anchor="middle" font-size="10" fill="#475569">HF: openlifescienceai/medqa - eval set (never retrieved)</text>
  <text x="300" y="131" text-anchor="middle" font-size="10" fill="#475569">train 10,178 / val 1,272 / test 1,273</text>

  <rect x="100" y="156" width="400" height="66" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="300" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">MedMCQA</text>
  <text x="300" y="197" text-anchor="middle" font-size="10" fill="#475569">HF: openlifescienceai/medmcqa - the only retrieval corpus</text>
  <text x="300" y="211" text-anchor="middle" font-size="10" fill="#475569">182,822 solved exam questions (used by V1-V5)</text>

  <line x1="300" y1="222" x2="300" y2="256" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>

  <!-- Layer B: embedding (RAG side only) -->
  <text x="140" y="250" font-size="10.5" font-weight="500" fill="#94A3B8">EMBEDDING (embedding model)</text>
  <rect x="140" y="256" width="320" height="56" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="300" y="282" text-anchor="middle" font-size="12" font-weight="500" fill="#115E59">qwen3-embedding:4b (V1-V5, 32K)</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#0F766E">via Ollama - embeds MedMCQA + every query</text>

  <line x1="300" y1="312" x2="300" y2="344" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>

  <!-- Layer C: vector store (left) and long-term memory (right) - SIBLINGS, same band, no
       dependency between them: both are persistence the orchestration layer below reads/writes,
       neither one feeds the other (long-term memory has no raw-data input at all). -->
  <text x="100" y="338" font-size="10.5" font-weight="500" fill="#94A3B8">VECTOR STORE</text>
  <text x="590" y="338" font-size="10.5" font-weight="500" fill="#94A3B8">LONG-TERM MEMORY (cross-episode, from V3)</text>

  <rect x="100" y="344" width="400" height="54" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="300" y="366" text-anchor="middle" font-size="13" font-weight="500" fill="#115E59">ChromaDB - persistent vector store, cosine / HNSW</text>
  <rect x="110" y="374" width="380" height="20" rx="5" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="300" y="388" text-anchor="middle" font-size="9.5" fill="#0F766E">knowledge_medmcqa_qwen3 (V1-V5, one shared collection)</text>

  <rect x="590" y="344" width="270" height="54" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="725" y="366" text-anchor="middle" font-size="12" font-weight="500" fill="#92400E">SqliteStore, persistent (graph/longterm.py)</text>
  <rect x="600" y="374" width="120" height="20" rx="5" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="660" y="388" text-anchor="middle" font-size="8.5" fill="#92400E">medqa-lessons (V3)</text>
  <rect x="730" y="374" width="120" height="20" rx="5" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="790" y="388" text-anchor="middle" font-size="8.5" fill="#92400E">medqa-mistakes (V5)</text>

  <line x1="300" y1="398" x2="300" y2="448" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ss)"/>
  <text x="312" y="426" font-size="10" fill="#475569">search_medmcqa (tool)</text>

  <line x1="725" y1="398" x2="725" y2="448" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ss)"/>
  <text x="737" y="426" font-size="10" fill="#475569">recall / remember</text>

  <!-- Layer D: orchestration -->
  <text x="40" y="442" font-size="10.5" font-weight="500" fill="#94A3B8">MULTI-AGENT ORCHESTRATION</text>
  <rect x="40" y="448" width="820" height="244" rx="10" fill="#E0E7FF" stroke="#4F46E5"/>
  <text x="450" y="470" text-anchor="middle" font-size="13" font-weight="500" fill="#3730A3">LangGraph - StateGraph compiled from a RunConfig, via build_graph(cfg)</text>

  <rect x="250" y="480" width="200" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="350" y="494" text-anchor="middle" font-size="9.5" fill="#3730A3">config.py - RunConfig / RagConfig</text>
  <rect x="470" y="480" width="180" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="560" y="494" text-anchor="middle" font-size="9.5" fill="#3730A3">roles.py - ROLE_PROMPTS</text>

  <!-- node-chain mini graph (V2-V5 shape; verify + distill_mistake are optional tails) -->
  <rect x="80" y="532" width="160" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="160" y="553" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">understand</text>

  <rect x="300" y="512" width="180" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="390" y="530" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">search (retrieve+digest)</text>
  <rect x="300" y="552" width="180" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="390" y="570" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">clinical-reasoner</text>

  <rect x="540" y="532" width="140" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="610" y="553" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">decider</text>

  <rect x="740" y="532" width="100" height="34" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-dasharray="4 3"/>
  <text x="790" y="548" text-anchor="middle" font-size="10" font-weight="500" fill="#5B21B6">verify</text>
  <text x="790" y="561" text-anchor="middle" font-size="9" fill="#7C3AED">V4/V5 only</text>

  <line x1="240" y1="542" x2="300" y2="526" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="240" y1="556" x2="300" y2="566" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="480" y1="526" x2="540" y2="542" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="480" y1="566" x2="540" y2="556" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="680" y1="549" x2="736" y2="549" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ss)"/>

  <!-- V5-only tail: distill_mistake, hangs off verify, drawn as a clearly sequential (not parallel) step -->
  <line x1="790" y1="566" x2="790" y2="578" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ss)"/>
  <rect x="730" y="578" width="120" height="34" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-dasharray="4 3"/>
  <text x="790" y="592" text-anchor="middle" font-size="9.5" font-weight="500" fill="#5B21B6">distill_mistake</text>
  <text x="790" y="604" text-anchor="middle" font-size="8" fill="#7C3AED">V5 only, on a miss</text>

  <text x="450" y="630" text-anchor="middle" font-size="10.5" fill="#3730A3">Each role (case-reasoner, evidence-digest, clinical-reasoner, decider, report-verifier,</text>
  <text x="450" y="645" text-anchor="middle" font-size="10.5" fill="#3730A3">mistake-analyst) is an Agent (agents/base.py): LangChain create_agent, lazily initialized</text>
  <text x="450" y="660" text-anchor="middle" font-size="10.5" fill="#3730A3">Reads/writes the shared QAState (short-term memory) + the SqliteStore (long-term memory, same band as ChromaDB)</text>

  <line x1="450" y1="692" x2="450" y2="726" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>
  <text x="462" y="712" font-size="10" fill="#475569">agent.say(...)</text>

  <!-- Layer E: LLM inference -->
  <text x="40" y="720" font-size="10.5" font-weight="500" fill="#94A3B8">LLM INFERENCE (shared BaseChatModel)</text>
  <rect x="40" y="726" width="820" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED"/>
  <rect x="80" y="738" width="350" height="46" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="255" y="757" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">Ollama (local, default)</text>
  <text x="255" y="773" text-anchor="middle" font-size="10" fill="#6D28D9">qwen2.5:7b</text>
  <rect x="470" y="738" width="350" height="46" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="645" y="757" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">Cloud providers (optional)</text>
  <text x="645" y="773" text-anchor="middle" font-size="9.5" fill="#6D28D9">anthropic: · openai: · google: · openrouter:</text>

  <line x1="450" y1="796" x2="450" y2="830" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>
  <text x="462" y="816" font-size="10" fill="#475569">answer(item) → AnswerResult</text>

  <!-- Layer F: evaluation -->
  <text x="40" y="824" font-size="10.5" font-weight="500" fill="#94A3B8">EVALUATION</text>
  <rect x="40" y="830" width="820" height="58" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="450" y="854" text-anchor="middle" font-size="12.5" font-weight="500" fill="#166534">qa/metrics.py - accuracy + 95% CI · invalid-rate · Win/Loss/Tie · McNemar · latency &amp; tokens</text>
  <text x="450" y="872" text-anchor="middle" font-size="10" fill="#15803D">AnswerResult(answer, rationale, tokens_in, tokens_out) compared against MedQA-USMLE gold labels</text>

  <!-- gold-label side path from MedQA-USMLE, straight down the left margin -->
  <path d="M100 109 L16 109 L16 859 L40 859" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ss)"/>
  <text x="9" y="484" font-size="9.5" fill="#64748B" transform="rotate(-90 9 484)">gold label used for scoring</text>

  <!-- legend: aligned 3-column x 2-row grid, same x per column across both rows -->
  <rect x="60" y="898" width="12" height="12" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="77" y="908" font-size="10" fill="#334155">data</text>
  <rect x="330" y="898" width="12" height="12" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="347" y="908" font-size="10" fill="#334155">embedding / vector (no LLM call)</text>
  <rect x="610" y="898" width="12" height="12" fill="#FEF3C7" stroke="#D97706"/>
  <text x="627" y="908" font-size="10" fill="#334155">long-term memory (SQLite, no LLM call)</text>

  <rect x="60" y="922" width="12" height="12" fill="#E0E7FF" stroke="#4F46E5"/>
  <text x="77" y="932" font-size="10" fill="#334155">orchestration (LangGraph/LangChain)</text>
  <rect x="330" y="922" width="12" height="12" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="347" y="932" font-size="10" fill="#334155">LLM call</text>
  <rect x="610" y="922" width="12" height="12" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="627" y="932" font-size="10" fill="#334155">evaluation</text>
</svg>
