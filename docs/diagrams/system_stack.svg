<svg xmlns="http://www.w3.org/2000/svg" width="760" height="906" viewBox="0 0 760 906" font-family="Helvetica, Arial, sans-serif">
  <title>Toàn bộ stack công nghệ của hệ thống</title>
  <defs>
    <marker id="ss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="500" fill="#0F172A">Kiến trúc nền tảng — toàn bộ stack công nghệ</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#64748B">Từ dữ liệu thô đến đáp án được chấm điểm — mỗi hộp là một thành phần thật trong mã nguồn</text>

  <!-- Layer A: data (stacked, single column, centered) -->
  <text x="40" y="70" font-size="10.5" font-weight="500" fill="#94A3B8">DỮ LIỆU (HuggingFace datasets, cùng tổ chức openlifescienceai)</text>
  <rect x="170" y="76" width="420" height="66" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="380" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">MedQA-USMLE</text>
  <text x="380" y="117" text-anchor="middle" font-size="10" fill="#475569">HF: openlifescienceai/medqa · bộ đề đánh giá (không truy hồi)</text>
  <text x="380" y="131" text-anchor="middle" font-size="10" fill="#475569">train 10.178 / val 1.272 / test 1.273</text>

  <rect x="170" y="156" width="420" height="66" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="380" y="180" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">MedMCQA</text>
  <text x="380" y="197" text-anchor="middle" font-size="10" fill="#475569">HF: openlifescienceai/medmcqa · ngữ liệu truy hồi duy nhất</text>
  <text x="380" y="211" text-anchor="middle" font-size="10" fill="#475569">182.822 câu thi đã giải (dùng cho V1–V4)</text>

  <line x1="380" y1="222" x2="380" y2="256" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>

  <!-- Layer B: embedding -->
  <text x="40" y="250" font-size="10.5" font-weight="500" fill="#94A3B8">EMBEDDING (mô hình nhúng)</text>
  <rect x="220" y="256" width="320" height="66" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="380" y="279" text-anchor="middle" font-size="13" font-weight="500" fill="#115E59">nomic-embed-text</text>
  <text x="380" y="295" text-anchor="middle" font-size="10" fill="#0F766E">qua Ollama · ngữ cảnh 8192 token</text>
  <text x="380" y="309" text-anchor="middle" font-size="10" fill="#0F766E">nhúng MedMCQA + mọi truy vấn</text>

  <line x1="380" y1="322" x2="380" y2="356" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>

  <!-- Layer C: vector store -->
  <text x="40" y="350" font-size="10.5" font-weight="500" fill="#94A3B8">LƯU TRỮ VECTOR</text>
  <rect x="180" y="356" width="400" height="54" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="380" y="378" text-anchor="middle" font-size="13" font-weight="500" fill="#115E59">ChromaDB — kho vector bền (persistent), cosine / HNSW</text>
  <rect x="255" y="386" width="250" height="20" rx="5" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="380" y="400" text-anchor="middle" font-size="10" fill="#0F766E">knowledge_medmcqa_nomic (bộ sưu tập duy nhất)</text>

  <!-- connector: orchestration queries the vector store — aligned above the "search" node below -->
  <line x1="321" y1="460" x2="321" y2="410" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ss)"/>
  <text x="333" y="440" font-size="10" fill="#475569">search_medmcqa (tool)</text>

  <!-- Layer D: orchestration -->
  <text x="40" y="454" font-size="10.5" font-weight="500" fill="#94A3B8">ĐIỀU PHỐI ĐA TÁC TỬ</text>
  <rect x="40" y="460" width="680" height="204" rx="10" fill="#E0E7FF" stroke="#4F46E5"/>
  <text x="380" y="482" text-anchor="middle" font-size="13" font-weight="500" fill="#3730A3">LangGraph — StateGraph biên dịch từ RunConfig, qua build_graph(cfg)</text>

  <rect x="290" y="492" width="200" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="390" y="506" text-anchor="middle" font-size="9.5" fill="#3730A3">config.py — RunConfig / RagConfig</text>
  <rect x="500" y="492" width="180" height="20" rx="5" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="590" y="506" text-anchor="middle" font-size="9.5" fill="#3730A3">roles.py — ROLE_PROMPTS</text>

  <!-- node-chain mini graph (V2-V4 shape) -->
  <rect x="64" y="544" width="140" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="134" y="565" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">understand</text>

  <rect x="246" y="524" width="150" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="321" y="542" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">search (retrieve+digest)</text>
  <rect x="246" y="564" width="150" height="28" rx="7" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="321" y="582" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">clinical-reasoner</text>

  <rect x="440" y="544" width="120" height="34" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="500" y="565" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">decider</text>

  <rect x="602" y="544" width="98" height="34" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-dasharray="4 3"/>
  <text x="651" y="560" text-anchor="middle" font-size="10" font-weight="500" fill="#5B21B6">verifier</text>
  <text x="651" y="573" text-anchor="middle" font-size="9" fill="#7C3AED">chỉ V3</text>

  <line x1="204" y1="554" x2="242" y2="538" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="204" y1="568" x2="242" y2="578" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="396" y1="538" x2="436" y2="554" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="396" y1="578" x2="436" y2="568" stroke="#64748B" stroke-width="1.3" marker-end="url(#ss)"/>
  <line x1="560" y1="561" x2="598" y2="561" stroke="#64748B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ss)"/>

  <text x="380" y="622" text-anchor="middle" font-size="10.5" fill="#3730A3">Mỗi vai (case-reasoner, evidence-digest, clinical-reasoner, decider, report-verifier)</text>
  <text x="380" y="637" text-anchor="middle" font-size="10.5" fill="#3730A3">là một Agent (agents/base.py): LangChain create_agent, khởi tạo trễ, không phụ thuộc nhà cung cấp</text>
  <text x="380" y="654" text-anchor="middle" font-size="10.5" fill="#3730A3">Đọc/ghi qua QAState dùng chung (graph/state.py) — bộ nhớ ngắn hạn của hệ thống; verifier không có công cụ tra cứu riêng</text>

  <line x1="380" y1="664" x2="380" y2="698" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>
  <text x="392" y="684" font-size="10" fill="#475569">agent.say(...)</text>

  <!-- Layer E: LLM inference -->
  <text x="40" y="692" font-size="10.5" font-weight="500" fill="#94A3B8">SUY LUẬN LLM (BaseChatModel dùng chung)</text>
  <rect x="40" y="698" width="680" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED"/>
  <rect x="64" y="710" width="310" height="46" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="219" y="729" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">Ollama (cục bộ, mặc định)</text>
  <text x="219" y="745" text-anchor="middle" font-size="10" fill="#6D28D9">qwen2.5:7b / 14b / 32b</text>
  <rect x="386" y="710" width="310" height="46" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="541" y="729" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">Nhà cung cấp đám mây (tuỳ chọn)</text>
  <text x="541" y="745" text-anchor="middle" font-size="9.5" fill="#6D28D9">anthropic: · openai: · google: · openrouter:</text>

  <line x1="380" y1="768" x2="380" y2="802" stroke="#64748B" stroke-width="1.5" marker-end="url(#ss)"/>
  <text x="392" y="788" font-size="10" fill="#475569">answer(item) → AnswerResult</text>

  <!-- Layer F: evaluation -->
  <text x="40" y="796" font-size="10.5" font-weight="500" fill="#94A3B8">ĐÁNH GIÁ</text>
  <rect x="40" y="802" width="680" height="58" rx="10" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="380" y="826" text-anchor="middle" font-size="12.5" font-weight="500" fill="#166534">qa/metrics.py — accuracy + CI 95% · invalid-rate · Thắng/Thua/Hòa · McNemar · độ trễ &amp; token</text>
  <text x="380" y="844" text-anchor="middle" font-size="10" fill="#15803D">AnswerResult(answer, rationale, tokens_in, tokens_out) so với nhãn đúng của MedQA-USMLE</text>

  <!-- gold-label side path from MedQA-USMLE, straight down the left margin -->
  <path d="M170 109 L16 109 L16 831 L40 831" fill="none" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ss)"/>
  <text x="9" y="470" font-size="9.5" fill="#64748B" transform="rotate(-90 9 470)">nhãn đúng (gold) để chấm điểm</text>

  <!-- legend -->
  <rect x="110" y="882" width="12" height="12" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="127" y="892" font-size="10" fill="#334155">dữ liệu</text>
  <rect x="190" y="882" width="12" height="12" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="207" y="892" font-size="10" fill="#334155">embedding / vector (không gọi LLM)</text>
  <rect x="410" y="882" width="12" height="12" fill="#E0E7FF" stroke="#4F46E5"/>
  <text x="427" y="892" font-size="10" fill="#334155">điều phối (LangGraph/LangChain)</text>
  <rect x="600" y="882" width="12" height="12" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="617" y="892" font-size="10" fill="#334155">lượt gọi LLM</text>
  <rect x="680" y="882" width="12" height="12" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="697" y="892" font-size="10" fill="#334155">đánh giá</text>
</svg>
