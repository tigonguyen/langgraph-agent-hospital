<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="Helvetica, Arial, sans-serif">
  <title>Thiết kế RAG — luật tin cậy bất đối xứng</title>
  <defs>
    <marker id="rga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="410" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">Từ bằng chứng thô đến luật tin cậy bất đối xứng</text>
  <text x="410" y="42" text-anchor="middle" font-size="11" fill="#64748B">Tiếp nối hạ tầng truy hồi (hình trước) — dùng chung cho V1 và Node 2/Node 4 của V2--V4</text>

  <!-- main chain: raw evidence -> digest -> confidence -->
  <rect x="30" y="60" width="240" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="150" y="80" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Bằng chứng thô</text>
  <text x="150" y="94" text-anchor="middle" font-size="9.5" fill="#475569">5 câu thi tương tự (Q: / A: / Why:)</text>
  <line x1="150" y1="100" x2="150" y2="112" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>

  <rect x="30" y="114" width="240" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="150" y="132" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">Digest bằng chứng (LLM)</text>
  <text x="150" y="146" text-anchor="middle" font-size="9" fill="#6D28D9">tóm 5 câu thi thành một đoạn ngắn</text>
  <text x="150" y="159" text-anchor="middle" font-size="8.5" fill="#6D28D9" font-style="italic">V2--V4: node evidence-digest riêng (Node 2)</text>
  <text x="150" y="169" text-anchor="middle" font-size="8.5" fill="#6D28D9" font-style="italic">V1: gộp vào lượt gọi cuối của agent</text>
  <line x1="150" y1="172" x2="150" y2="184" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>

  <rect x="30" y="186" width="240" height="46" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="150" y="205" text-anchor="middle" font-size="11" font-weight="500" fill="#5B21B6">Tự chấm độ tin cậy</text>
  <text x="150" y="219" text-anchor="middle" font-size="10" fill="#6D28D9">HIGH · MEDIUM · LOW (cùng lượt gọi với digest)</text>
  <line x1="150" y1="232" x2="150" y2="284" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>

  <!-- decision 1 -->
  <rect x="30" y="286" width="240" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="5 3"/>
  <text x="150" y="308" text-anchor="middle" font-size="11" font-weight="500" fill="#92400E">HIGH và rõ ràng nghiêng</text>
  <text x="150" y="322" text-anchor="middle" font-size="11" font-weight="500" fill="#92400E">về một phương án?</text>
  <text x="150" y="338" text-anchor="middle" font-size="9" fill="#B45309" font-style="italic">quyết định do LLM tự đánh giá, không phải ngưỡng số</text>

  <!-- NO branch: medium/low -> reasoning alone -->
  <line x1="270" y1="316" x2="330" y2="316" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>
  <text x="285" y="308" font-size="9.5" fill="#64748B">MEDIUM / LOW</text>
  <rect x="332" y="286" width="270" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="467" y="304" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">Gạt bằng chứng sang một bên</text>
  <text x="467" y="319" text-anchor="middle" font-size="9.5" fill="#6D28D9">quyết định thuần từ lập luận lâm sàng</text>
  <text x="467" y="333" text-anchor="middle" font-size="9.5" fill="#6D28D9">(đúng như cách V0 quyết định)</text>

  <!-- YES branch: down to decision 2 -->
  <line x1="150" y1="346" x2="150" y2="368" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>
  <text x="163" y="362" font-size="9.5" fill="#64748B">HIGH, nghiêng rõ</text>

  <rect x="30" y="370" width="240" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="5 3"/>
  <text x="150" y="392" text-anchor="middle" font-size="10.5" font-weight="500" fill="#92400E">Lập luận nêu được dấu hiệu</text>
  <text x="150" y="406" text-anchor="middle" font-size="10.5" font-weight="500" fill="#92400E">CỤ THỂ bị bằng chứng bỏ sót?</text>
  <text x="150" y="422" text-anchor="middle" font-size="9" fill="#B45309" font-style="italic">không phải "cảm giác chung chung là có lẽ khác"</text>

  <line x1="270" y1="400" x2="330" y2="400" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>
  <text x="285" y="392" font-size="9.5" fill="#64748B">có</text>
  <rect x="332" y="370" width="270" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="467" y="386" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">Lật lại theo lập luận lâm sàng</text>
  <text x="467" y="400" text-anchor="middle" font-size="9.5" fill="#6D28D9">bằng chứng bị bác bỏ có căn cứ</text>

  <line x1="150" y1="430" x2="150" y2="450" stroke="#64748B" stroke-width="1.4" marker-end="url(#rga)"/>
  <text x="163" y="446" font-size="9.5" fill="#64748B">không</text>
  <rect x="30" y="452" width="240" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="150" y="468" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B21B6">Giữ đáp án theo bằng chứng</text>
  <text x="150" y="482" text-anchor="middle" font-size="9.5" fill="#6D28D9">(mặc định — bằng chứng tốt được ưu tiên)</text>

  <!-- convergence to final answer -->
  <line x1="602" y1="316" x2="680" y2="316" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#rga)"/>
  <line x1="602" y1="391" x2="680" y2="360" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#rga)"/>
  <line x1="270" y1="473" x2="720" y2="473" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="720" y1="473" x2="720" y2="402" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#rga)"/>

  <rect x="660" y="300" width="130" height="80" rx="8" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="725" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">Quyết định</text>
  <text x="725" y="346" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">cuối cùng</text>
  <text x="725" y="362" text-anchor="middle" font-size="9.5" fill="#475569">"Answer: X"</text>

  <text x="410" y="518" text-anchor="middle" font-size="10.5" fill="#64748B">Bất đối xứng có chủ đích: bằng chứng tốt được ưu tiên mặc định,</text>
  <text x="410" y="536" text-anchor="middle" font-size="10.5" fill="#64748B">nhưng không tự động thắng một lập luận nêu được dấu hiệu cụ thể.</text>
</svg>
