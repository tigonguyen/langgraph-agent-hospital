<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif">
  <title>V0–V4 ablation ladder</title>
  <defs>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">The ablation ladder — one config, one graph per variant</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#64748B">every variant is a preset RunConfig compiled by build_graph(cfg)</text>

  <rect x="40" y="62" width="66" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="73" y="84" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">V0</text>
  <rect x="126" y="62" width="140" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="196" y="84" text-anchor="middle" font-size="12" fill="#334155">answer</text>
  <text x="600" y="84" text-anchor="middle" font-size="11" fill="#64748B">1 agent · 1 call</text>

  <rect x="40" y="112" width="66" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="73" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">V1</text>
  <rect x="126" y="112" width="300" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="276" y="134" text-anchor="middle" font-size="12" fill="#334155">reason → retrieve → answer</text>
  <text x="600" y="134" text-anchor="middle" font-size="11" fill="#64748B">2 agents · 2 calls</text>

  <rect x="40" y="162" width="66" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="73" y="184" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">V2</text>
  <rect x="126" y="162" width="380" height="34" rx="6" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="316" y="184" text-anchor="middle" font-size="12" fill="#334155">reason → retrieve → clinical_reason → answer</text>
  <text x="600" y="184" text-anchor="middle" font-size="11" fill="#64748B">3 agents · 3 calls</text>

  <rect x="40" y="212" width="66" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="73" y="234" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">V3</text>
  <rect x="126" y="212" width="380" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="316" y="234" text-anchor="middle" font-size="12" fill="#334155">reason → retrieve → panel → aggregate → verify</text>
  <text x="600" y="234" text-anchor="middle" font-size="11" fill="#64748B">5 agents · 5 calls</text>

  <rect x="40" y="262" width="66" height="34" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="73" y="284" text-anchor="middle" font-size="12" font-weight="500" fill="#5B21B6">V4</text>
  <rect x="126" y="262" width="300" height="34" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="276" y="284" text-anchor="middle" font-size="12" fill="#334155">reason → retrieve → panel → aggregate</text>
  <text x="600" y="284" text-anchor="middle" font-size="11" fill="#64748B">4 agents · 4 calls</text>

  <line x1="112" y1="96" x2="112" y2="110" stroke="#64748B" stroke-width="1.2" marker-end="url(#al)"/>
  <line x1="112" y1="146" x2="112" y2="160" stroke="#64748B" stroke-width="1.2" marker-end="url(#al)"/>
  <line x1="112" y1="196" x2="112" y2="210" stroke="#64748B" stroke-width="1.2" marker-end="url(#al)"/>
  <line x1="112" y1="246" x2="112" y2="260" stroke="#64748B" stroke-width="1.2" marker-end="url(#al)"/>

  <text x="440" y="105" font-size="10" fill="#7C3AED">+ RAG</text>
  <text x="520" y="155" font-size="10" fill="#7C3AED">+ clinical reasoning</text>
  <text x="520" y="205" font-size="10" fill="#7C3AED">+ panel / attending / verifier</text>
  <text x="440" y="255" font-size="10" fill="#7C3AED">− verifier</text>

  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#64748B">Each rung adds exactly one component, so accuracy deltas are attributable.</text>
  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#64748B">Caveat: V1/V2 use the MedMCQA corpus while V3/V4 use textbooks — V2→V3 confounds corpus with architecture.</text>
</svg>
